version: '3.8'

services:
  postgres-planetary-vault:
    image: pgvector/pgvector:pg16
    container_name: aethelgard-postgres
    environment:
      POSTGRES_DB: aethelgard_prime_db
      POSTGRES_USER: aethelgard_admin
      POSTGRES_PASSWORD: aethelgard_password
    ports:
      - "5432:5432"
    volumes:
      - ./sql/init-postgres-sovereign.sql:/docker-entrypoint-initdb.d/init-postgres-sovereign.sql

  ibm-db2-mainframe:
    image: icr.io/db2_community/db2:11.5.9.0
    container_name: aethelgard-db2
    privileged: true
    environment:
      LICENSE: accept
      DB2INST1_PASSWORD: db2admin_password
      DBNAME: SOV_RTGS
    ports:
      - "50000:50000"
    volumes:
      - ./sql/init-db2-mainframe.sql:/var/custom/init-db2-mainframe.sql

  kafka-global-backbone:
    image: apache/kafka:3.7.0
    container_name: aethelgard-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
