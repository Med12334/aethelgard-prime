server:
  port: 8083

spring:
  application:
    name: ibm-db2-mainframe-bridge
  datasource:
    url: jdbc:h2:mem:SOV_RTGS;MODE=DB2;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
